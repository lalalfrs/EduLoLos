    <line x1="200" y1="110" x2="200" y2="280" stroke="#000" stroke-width="3" />
    <line x1="203" y1="110" x2="203" y2="280" stroke="#000" stroke-width="3" />
  </g>

  <!-- Yellow Lotus Flower (Bunga Teratai) -->
  <path d="M 190,265 C 130,240 100,160 145,155 C 170,185 185,230 190,265 Z" fill="#ffeb3b" stroke="#000" stroke-width="6" stroke-linejoin="round" />
  <path d="M 210,265 C 270,240 300,160 255,155 C 230,185 215,230 210,265 Z" fill="#ffeb3b" stroke="#000" stroke-width="6" stroke-linejoin="round" />
