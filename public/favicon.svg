  <!-- Inner Circle Background (White) -->
  <circle cx="200" cy="182.5" r="118" fill="#ffffff" stroke="#000000" stroke-width="8"/>

  <!-- Tugu Pahlawan Tower (Center Vertical) -->
  <g stroke="#000000" stroke-width="5" stroke-linejoin="round" fill="#e0e0e0">
    <path d="M 200,40 L 206,65 L 194,65 Z" fill="#ffffff" />
    <path d="M 200,65 L 208,110 L 192,110 Z" fill="#f5f5f5" />
    <path d="M 191,110 L 209,110 L 211,280 L 189,280 Z" fill="#ffffff" />
